name: Build release binaries

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          # Casting PCs are usually Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: servujatkot.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            bin: servujatkot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: servujatkot-${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}
          retention-days: 14

  # On a tag, publish the binaries as a GitHub release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
      - name: Name the binaries by platform
        run: |
          mv servujatkot-x86_64-unknown-linux-musl/servujatkot servujatkot-linux-x86_64
          mv servujatkot-x86_64-pc-windows-msvc/servujatkot.exe servujatkot-windows-x86_64.exe
          chmod +x servujatkot-linux-x86_64
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
          --title "$GITHUB_REF_NAME" --generate-notes
          servujatkot-linux-x86_64 servujatkot-windows-x86_64.exe
