[package]
name = "servujatkot"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Casting tools for esports broadcasts: Dota 2 observer configs, Game State Integration and OBS overlays"
license = "MIT"
repository = "https://github.com/tenderi/servujatkot"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = "0.8"
maud = { version = "0.27", features = ["axum"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive", "env"] }
anyhow = "1"
regex = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

[profile.release]
strip = true
lto = "thin"
